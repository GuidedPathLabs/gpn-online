<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin — Guided Path One-on-One</title>
<style>
:root{--bg:#060f1e;--bg2:#0a192f;--bg3:#102844;--line:rgba(0,184,212,.22);--l2:rgba(0,184,212,.12);--cy:#00e5ff;--cyd:#00b8d4;--gold:#ffd54f;--tx:#e0e0e0;--mu:#8a9bb0;--dng:#ff6b6b;--ok:#4caf50;--wn:#ffb300}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--cy);text-decoration:underline}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(6,15,30,.96);border-bottom:1px solid var(--line);min-height:56px}
.brand{font-size:1rem;font-weight:700;color:var(--cy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--gold)}
.user{font-size:.8rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--cy);font-size:1.2rem;border-radius:6px;width:40px;height:40px;cursor:pointer}
@media(max-width:900px){.burger{display:inline-flex;align-items:center;justify-content:center}.user{display:none}}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px 16px 60px}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px 12px 60px}}
.sidebar{position:sticky;top:72px;align-self:start;background:var(--bg2);border:1px solid var(--l2);border-radius:10px;padding:12px;max-height:calc(100vh - 96px);overflow-y:auto}
.sidebar h4{margin:12px 8px 6px;font-size:.68rem;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--tx);font-family:inherit;font-size:.85rem;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:background .15s,border-color .15s,color .15s}
.navbtn:hover{background:rgba(0,184,212,.06);color:var(--cy)}
.navbtn.active{background:rgba(0,184,212,.1);border-color:var(--line);color:var(--gold);font-weight:700}
.navbtn.danger{color:var(--dng)}
@media(max-width:900px){.sidebar{position:fixed;top:56px;left:0;right:0;bottom:0;z-index:40;border-radius:0;max-height:none;transform:translateX(-100%);transition:transform .22s ease}.sidebar.open{transform:translateX(0)}}
.content{min-width:0}
.stitle{font-size:1.3rem;color:var(--cy);margin:0 0 4px;font-weight:700}
.ssub{color:var(--mu);font-size:.85rem;margin:0 0 20px}
.panel{background:var(--bg2);border:1px solid var(--l2);border-radius:10px;padding:18px;margin-bottom:18px}
.ptitle{font-size:.95rem;color:var(--gold);margin:0 0 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg3);border:1px solid var(--l2);border-radius:8px;padding:14px 16px}
.stat .lbl{display:block;font-size:.7rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.stat .val{display:block;font-size:1.6rem;font-weight:700;color:var(--cy);line-height:1.1}
.stat .val.gold{color:var(--gold)}
.stat .val.dng{color:var(--dng)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;font-family:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:rgba(0,184,212,.08);color:var(--cy);transition:background .18s,border-color .18s,color .18s;min-height:40px;text-decoration:none}
.btn:hover{background:rgba(0,184,212,.16);border-color:var(--cy);text-decoration:none}
.btn.gold{border-color:rgba(255,213,79,.45);color:var(--gold);background:rgba(255,213,79,.06)}
.btn.gold:hover{background:rgba(255,213,79,.14);border-color:var(--gold)}
.btn.dng{border-color:rgba(255,107,107,.5);color:var(--dng);background:rgba(255,107,107,.06)}
.btn.dng:hover{background:rgba(255,107,107,.14);border-color:var(--dng)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--l2)}
.btn.ghost:hover{border-color:var(--cy);color:var(--cy)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.arow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg.full{grid-column:1/-1}
.fg label{font-size:.7rem;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--l2);border-radius:6px;color:var(--tx);font-family:inherit;font-size:.9rem;min-height:40px}
.fg textarea{min-height:90px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.12)}
.hint{font-size:.72rem;color:var(--mu)}
.twrap{width:100%;overflow-x:auto;border:1px solid var(--l2);border-radius:8px;background:var(--bg2);-webkit-overflow-scrolling:touch}
table.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
.tbl th{font-size:.68rem;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;background:rgba(0,184,212,.04);position:sticky;top:0;z-index:1}
.tbl td.wrap{white-space:normal;word-break:break-word}
.tbl tr:hover td{background:rgba(0,184,212,.03)}
.bdg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent}
.bdg.draft{color:#8a9bb0;border-color:rgba(138,155,176,.4)}
.bdg.available{color:var(--cy);border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.08)}
.bdg.closed{color:var(--wn);border-color:rgba(255,179,0,.5);background:rgba(255,179,0,.08)}
.bdg.published{color:var(--ok);border-color:rgba(76,175,80,.5);background:rgba(76,175,80,.08)}
.bdg.active{color:var(--ok);border-color:rgba(76,175,80,.4)}
.bdg.inactive{color:var(--mu);border-color:rgba(138,155,176,.3)}
.bdg.dng{color:var(--dng);border-color:rgba(255,107,107,.4)}
.load{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--cy);background:rgba(0,184,212,.04)}
.empty{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--mu);background:rgba(255,255,255,.02);border:1px dashed var(--l2)}
.err{padding:28px 20px;text-align:center;border-radius:8px;font-size:.9rem;color:var(--dng);background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.3)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,229,255,.25);border-top-color:var(--cy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.tw{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px);pointer-events:none}
.tt{background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:6px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:auto}
.tt.ok{border-color:rgba(76,175,80,.5);color:#b6e8b6}
.tt.error{border-color:rgba(255,107,107,.5);color:#ffbaba}
.mono{font-family:'Courier New',monospace;font-size:.82rem;color:var(--cy)}
.quiet{color:var(--mu);font-size:.82rem}
.mt16{margin-top:16px}
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="brand">Guided Path <b>Admin</b></div>
  <div class="user" id="topUser">…</div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h4>Overview</h4>
    <button class="navbtn active" data-view="dashboard">Dashboard</button>
    <button class="navbtn" data-view="analytics">Analytics</button>
    <button class="navbtn" data-view="activity">Activity Log</button>

    <h4>Curriculum</h4>
    <button class="navbtn" data-view="programmes">Programmes</button>
    <button class="navbtn" data-view="subjects">Subjects</button>
    <button class="navbtn" data-view="chapters">Chapters</button>

    <h4>People</h4>
    <button class="navbtn" data-view="students">Students</button>
    <button class="navbtn" data-view="enrolments">Enrolments</button>
    <button class="navbtn" data-view="payments">Payments</button>

    <h4>Content</h4>
    <button class="navbtn" data-view="materials">Study Materials</button>
    <button class="navbtn" data-view="questionbank">Question Bank</button>
    <button class="navbtn" data-view="schedule">Schedule</button>

    <h4>Assessment</h4>
    <button class="navbtn" data-view="tests">Tests</button>
    <button class="navbtn" data-view="results">Results</button>
    <button class="navbtn" data-view="remarks">Remarks</button>

    <h4>Account</h4>
    <button class="navbtn" data-view="password">Change Password</button>
    <button class="navbtn danger" id="logoutBtn">Sign out</button>
  </aside>

  <main class="content" id="content">
    <div class="load"><span class="spin"></span>Loading…</div>
  </main>
</div>

<div class="tw" id="toastWrap"></div>

<script>
const GPN_API_URL = 'https://script.google.com/macros/s/AKfycbx0dOo1ovROMdFYedx4Gm3a1tmpZjjXEwqcxLjCzWXC3Tgxupo9Mc3obk5zDS3uat_7/exec';
const K_TOKEN='gpn_token',K_ROLE='gpn_role',K_USER='gpn_user',K_NAME='gpn_name';

function getToken(){return localStorage.getItem(K_TOKEN)||'';}
function getRole(){return localStorage.getItem(K_ROLE)||'';}
function getUser(){return localStorage.getItem(K_USER)||'';}
function getName(){return localStorage.getItem(K_NAME)||'';}
function clearSession(){[K_TOKEN,K_ROLE,K_USER,K_NAME].forEach(function(k){localStorage.removeItem(k);});}

function toast(msg, kind){
  var w=document.getElementById('toastWrap');
  var el=document.createElement('div');
  el.className='tt '+(kind||'');
  el.textContent=msg;
  w.appendChild(el);
  setTimeout(function(){el.remove();},4000);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function apiCall(action, payload){
  try{
    var res=await fetch(GPN_API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:action,token:getToken(),payload:payload||{}}),
      redirect:'follow'
    });
    var j=await res.json();
    if(j&&j.ok===false&&['SESSION_EXPIRED','SESSION_REVOKED','ACCOUNT_INACTIVE'].indexOf(j.code)>=0){
      clearSession();
      toast('Session expired. Redirecting…','error');
      setTimeout(function(){window.location.href='login.html';},1200);
    }
    return j;
  }catch(e){ return {ok:false,error:'Network error.',code:'NETWORK'}; }
}

(function(){
  if(!getToken()){window.location.href='login.html';return;}
  if(String(getRole()).toUpperCase()!=='ADMIN'){window.location.href='student.html';return;}
  var u=document.getElementById('topUser');
  if(u) u.textContent='Admin: '+(getName()||getUser());
})();

var sidebar=document.getElementById('sidebar');
var burger=document.getElementById('burger');
var content=document.getElementById('content');
burger.onclick=function(){sidebar.classList.toggle('open');};

document.querySelectorAll('.navbtn[data-view]').forEach(function(b){
  b.onclick=function(){
    var v=b.getAttribute('data-view');
    document.querySelectorAll('.navbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    if(window.matchMedia('(max-width:900px)').matches)sidebar.classList.remove('open');
    render(v);
  };
});
document.getElementById('logoutBtn').onclick=async function(){
  await apiCall('logout');
  clearSession();
  window.location.href='login.html';
};

function loading(){content.innerHTML='<div class="load"><span class="spin"></span>Loading…</div>';}
function errorState(m){content.innerHTML='<div class="err">'+esc(m)+'</div>';}
function emptyState(m){return '<div class="empty">'+esc(m||'Nothing here yet.')+'</div>';}
function header(t,s){return '<h2 class="stitle">'+esc(t)+'</h2>'+(s?'<p class="ssub">'+esc(s)+'</p>':'');}
function badge(t,cls){var c=cls||String(t||'').toLowerCase();return '<span class="bdg '+esc(c)+'">'+esc(t)+'</span>';}
function stat(l,v,cls){return '<div class="stat"><span class="lbl">'+esc(l)+'</span><span class="val '+(cls||'')+'">'+esc(v)+'</span></div>';}

function fg(label,id,type,opts){
  opts=opts||{};
  var a='';
  if(opts.required)a+=' required';
  if(opts.minlength)a+=' minlength="'+opts.minlength+'"';
  if(opts.placeholder)a+=' placeholder="'+esc(opts.placeholder)+'"';
  if(opts.value!=null)a+=' value="'+esc(opts.value)+'"';
  var full=opts.full?' full':'';
  var hint=opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':'';
  if(type==='textarea')return '<div class="fg'+full+'"><label for="'+esc(id)+'">'+esc(label)+'</label><textarea id="'+esc(id)+'"'+a+'>'+esc(opts.value||'')+'</textarea>'+hint+'</div>';
  if(type==='select'){
    var o=(opts.options||[]).map(function(x){
      var v=(typeof x==='string')?x:x.value;
      var t=(typeof x==='string')?x:x.label;
      var sel=(opts.value!=null&&String(opts.value)===String(v))?' selected':'';
      return '<option value="'+esc(v)+'"'+sel+'>'+esc(t)+'</option>';
    }).join('');
    return '<div class="fg'+full+'"><label for="'+esc(id)+'">'+esc(label)+'</label><select id="'+esc(id)+'"'+a+'>'+o+'</select>'+hint+'</div>';
  }
  return '<div class="fg'+full+'"><label for="'+esc(id)+'">'+esc(label)+'</label><input id="'+esc(id)+'" type="'+esc(type)+'"'+a+' />'+hint+'</div>';
}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function rowsToOptions(rows,idKey,nameKey,emptyLabel){
  return [{value:'',label:emptyLabel||'— Optional —'}].concat(rows.map(function(r){
    return {value:r[idKey],label:(r[nameKey]||r[idKey])};
  }));
}

function render(v){
  loading();
  var fn=VIEWS[v]||VIEWS.dashboard;
  fn().catch(function(e){errorState(e&&e.message?e.message:String(e));});
}
const VIEWS={};

/* ---------- DASHBOARD ---------- */
VIEWS.dashboard=async function(){
  var r=await apiCall('adminOverview');
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var d=r.data||{};
  var html=header('Dashboard','Live overview of GPN activity.');
  html+='<div class="stats">'+
    stat('Total Students',d.totalStudents||0)+
    stat('Active',d.activeStudents||0)+
    stat('Suspended',d.suspendedStudents||0,'dng')+
    stat('Active Programmes',d.activeProgrammes||0,'gold')+
    stat('Tests Today',d.testsToday||0)+
    stat('Tests This Week',d.testsThisWeek||0)+
    stat('Pending Publications',d.pendingPublications||0,'gold')+
    stat('Missed Tests',d.missedTests||0,'dng')+
  '</div>';

  html+='<div class="panel"><div class="ptitle">Recent Submissions</div>';
  if(d.recentSubmissions&&d.recentSubmissions.length){
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Student</th><th>Test</th><th>Status</th><th>Submitted</th></tr></thead><tbody>';
    d.recentSubmissions.forEach(function(s){
      html+='<tr><td>'+esc(s.StudentName||s.StudentID)+'</td><td class="wrap">'+esc(s.TestTitle||s.TestID)+'</td><td>'+badge(s.Status||'')+'</td><td>'+esc(s.SubmittedAt||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  } else html+=emptyState('No recent submissions.');
  html+='</div>';

  if(d.expiring&&d.expiring.length){
    html+='<div class="panel"><div class="ptitle">Enrolments Expiring (≤14 days)</div>';
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Student</th><th>End Date</th><th>Days Left</th></tr></thead><tbody>';
    d.expiring.forEach(function(e){
      html+='<tr><td>'+esc(e.Name||e.StudentID)+'</td><td>'+esc(e.EndDate)+'</td><td>'+badge(e.DaysLeft+' d',e.DaysLeft<=3?'dng':'')+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  }
  content.innerHTML=html;
};

/* ---------- ANALYTICS ---------- */
VIEWS.analytics=async function(){
  var r=await apiCall('adminAnalytics');
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var rows=(r.data&&r.data.students)||[];
  var html=header('Analytics','Per-student performance.');
  if(!rows.length){content.innerHTML=html+emptyState('No results yet.');return;}
  html+='<div class="twrap"><table class="tbl"><thead><tr><th>Student</th><th>Tests</th><th>Avg %</th><th>Highest</th><th>Lowest</th><th></th></tr></thead><tbody>';
  rows.forEach(function(s){
    html+='<tr>'+
      '<td>'+esc(s.Name||s.StudentID)+'</td>'+
      '<td>'+esc(s.tests||0)+'</td>'+
      '<td>'+esc(s.avg||0)+'%</td>'+
      '<td>'+esc(s.highest||0)+'%</td>'+
      '<td>'+esc(s.lowest||0)+'%</td>'+
      '<td><button class="btn ghost" data-drill="'+esc(s.StudentID)+'">Details</button></td>'+
    '</tr>';
  });
  html+='</tbody></table></div>';
  content.innerHTML=html;

  content.querySelectorAll('button[data-drill]').forEach(function(b){
    b.onclick=async function(){
      var sid=b.getAttribute('data-drill');
      var r2=await apiCall('adminStudentAnalytics',{studentId:sid});
      if(!r2.ok)return toast(r2.error||'Failed.','error');
      var s=r2.data.summary||{}, bys=r2.data.bySubject||[];
      var h=header('Analytics — '+sid,'Detailed performance.');
      h+='<div class="stats">'+
        stat('Tests',s.tests||0)+
        stat('Avg %',s.avg||0,'gold')+
        stat('Highest',(s.highest||0)+'%')+
        stat('Lowest',(s.lowest||0)+'%')+
      '</div>';
      h+='<div class="panel"><div class="ptitle">By Subject</div>';
      if(!bys.length)h+=emptyState('No subject data.');
      else{
        h+='<div class="twrap"><table class="tbl"><thead><tr><th>Subject</th><th>Tests</th><th>Avg %</th></tr></thead><tbody>';
        bys.forEach(function(x){
          h+='<tr><td>'+esc(x.name||x.subjectId)+'</td><td>'+esc(x.tests)+'</td><td>'+esc(x.avg)+'%</td></tr>';
        });
        h+='</tbody></table></div>';
      }
      h+='</div>';
      h+='<div class="arow"><button class="btn ghost" id="an_back">← Back</button></div>';
      content.innerHTML=h;
      document.getElementById('an_back').onclick=function(){render('analytics');};
    };
  });
};

/* ---------- ACTIVITY ---------- */
VIEWS.activity=async function(){
  var r=await apiCall('adminActivity',{limit:200});
  if(!r.ok)return errorState(r.error||'Failed to load.');
  var rows=(r.data&&r.data.activity)||[];
  var html=header('Activity Log','Last 200 events.');
  if(!rows.length){content.innerHTML=html+emptyState('No activity yet.');return;}
  html+='<div class="twrap"><table class="tbl"><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Entity</th><th>Description</th></tr></thead><tbody>';
  rows.forEach(function(a){
    html+='<tr>'+
      '<td>'+esc(a.Timestamp)+'</td>'+
      '<td>'+esc(a.UserID)+'</td>'+
      '<td>'+esc(a.Role)+'</td>'+
      '<td>'+esc(a.Action)+'</td>'+
      '<td>'+esc(a.EntityType)+(a.EntityID?' / '+esc(a.EntityID):'')+'</td>'+
      '<td class="wrap">'+esc(a.Description)+'</td>'+
    '</tr>';
  });
  html+='</tbody></table></div>';
  content.innerHTML=html;
};

/* ---------- PROGRAMMES ---------- */
VIEWS.programmes=async function(){
  var rs=await Promise.all([apiCall('adminListProgrammes'),apiCall('adminListSubjects')]);
  var rp=rs[0];
  if(!rp.ok)return errorState(rp.error||'Failed to load.');
  var programmes=(rp.data&&rp.data.programmes)||[];
  var subjects=(rs[1].ok&&rs[1].data&&rs[1].data.subjects)||[];

  var html=header('Programmes','Create programmes and attach subjects.');
  html+='<div class="panel"><div class="ptitle">Create Programme</div>'+
    '<div class="fgrid">'+
      fg('Name','p_name','text',{required:true})+
      fg('Class','p_class','text',{})+
      fg('Board','p_board','text',{})+
      fg('Duration','p_duration','text',{})+
      fg('Price','p_price','number',{})+
      fg('Description','p_desc','textarea',{full:true})+
    '</div>'+
    '<div class="arow mt16"><button class="btn gold" id="p_create">Create Programme</button></div>'+
  '</div>';

  html+='<div class="panel"><div class="ptitle">All Programmes ('+programmes.length+')</div>';
  if(!programmes.length)html+=emptyState('No programmes yet.');
  else{

async function openProgrammeSubjects(programmeId){
  var rs=await Promise.all([apiCall('adminListProgrammes'),apiCall('adminListSubjects')]);
  var rp=rs[0];
  if(!rp.ok)return toast('Failed to load.','error');
  var prog=(rp.data.programmes||[]).filter(function(x){return String(x.ProgrammeID)===String(programmeId);})[0];
  if(!prog)return toast('Programme not found.','error');
  var subjects=(rs[1].ok&&rs[1].data&&rs[1].data.subjects)||[];
  var linked=(prog.Subjects||[]).map(function(x){return String(x.SubjectID);});
  var available=subjects.filter(function(s){return linked.indexOf(String(s.SubjectID))<0;});

  var html=header('Programme — '+prog.Name,'Manage attached subjects.');
  html+='<div class="arow"><button class="btn ghost" id="pm_back">← Back</button></div>';
  html+='<div class="panel"><div class="ptitle">Attach Subject</div><div class="fgrid">'+
    fg('Subject','pm_subject','select',{options:rowsToOptions(available,'SubjectID','Name','— Select —'),required:true})+
  '</div><div class="arow mt16"><button class="btn gold" id="pm_add">Add Subject</button></div></div>';

  html+='<div class="panel"><div class="ptitle">Attached Subjects ('+(prog.Subjects||[]).length+')</div>';
  if(!prog.Subjects||!prog.Subjects.length)html+=emptyState('No subjects attached.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>ID</th><th>Name</th><th>Class</th><th></th></tr></thead><tbody>';
    prog.Subjects.forEach(function(s){
      html+='<tr><td class="mono">'+esc(s.SubjectID)+'</td><td>'+esc(s.Name)+'</td><td>'+esc(s.Class)+'</td><td><button class="btn dng" data-rem="'+esc(s.SubjectID)+'">Remove</button></td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  content.innerHTML=html;

  document.getElementById('pm_back').onclick=function(){render('programmes');};
  document.getElementById('pm_add').onclick=async function(){
    var sid=val('pm_subject');
    if(!sid)return toast('Pick a subject.','error');
    var r=await apiCall('adminAddProgrammeSubject',{programmeId:programmeId,subjectId:sid});
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Attached.','ok');openProgrammeSubjects(programmeId);
  };
  content.querySelectorAll('button[data-rem]').forEach(function(b){
    b.onclick=async function(){
      var r=await apiCall('adminRemoveProgrammeSubject',{programmeId:programmeId,subjectId:b.getAttribute('data-rem')});
      if(!r.ok)return toast(r.error||'Failed.','error');
      toast('Removed.','ok');openProgrammeSubjects(programmeId);
    };
  });
}

  html+='<div class="arow"><button class="btn ghost" id="qb_back">← Back</button></div>';

    fg('Title','qb_title','text',{required:true,value:q.Title||''})+
    fg('R2 URL','qb_r2','text',{full:true,required:true,value:q.R2URL||''})+
    fg('Subject','qb_subject','select',{options:rowsToOptions(subjects,'SubjectID','Name'),value:q.SubjectID||''})+
    fg('Chapter','qb_chapter','select',{options:rowsToOptions(chapters,'ChapterID','Name'),value:q.ChapterID||''})+
    fg('Programme','qb_programme','select',{options:rowsToOptions(programmes,'ProgrammeID','Name'),value:q.ProgrammeID||''})+
    fg('Class','qb_class','text',{value:q.Class||''})+
    fg('Status','qb_status','select',{options:['ACTIVE','INACTIVE'],value:q.Status||'ACTIVE'})+
    fg('Description','qb_desc','textarea',{full:true,value:q.Description||''})+
  '</div><div class="arow mt16"><button class="btn gold" id="qb_save">Save</button></div></div>';
  content.innerHTML=html;

  document.getElementById('qb_back').onclick=function(){render('questionbank');};
  document.getElementById('qb_save').onclick=async function(){
    var url=val('qb_r2');
    if(url.indexOf('r2://')!==0)return toast('R2 URL must start with r2://','error');
    var patch={
      Title:val('qb_title'),R2URL:url,SubjectID:val('qb_subject'),
      ChapterID:val('qb_chapter'),ProgrammeID:val('qb_programme'),
      Class:val('qb_class'),Status:val('qb_status'),Description:val('qb_desc')
    };
    var r=await apiCall('adminUpdateQuestionBank',{id:id,patch:patch});
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Updated.','ok');render('questionbank');
  };
}

/* ---------- SCHEDULE ---------- */
VIEWS.schedule=async function(){
  var rs=await Promise.all([apiCall('adminListSchedule'),apiCall('adminListStudents'),apiCall('adminListSubjects'),apiCall('adminListProgrammes')]);
  var r1=rs[0];
  if(!r1.ok)return errorState(r1.error||'Failed to load.');
  var schedule=(r1.data&&r1.data.schedule)||[];
  var students=(rs[1].ok&&rs[1].data&&rs[1].data.students)||[];
  var subjects=(rs[2].ok&&rs[2].data&&rs[2].data.subjects)||[];
  var programmes=(rs[3].ok&&rs[3].data&&rs[3].data.programmes)||[];

  var html=header('Schedule','Create schedule entries.');
  html+='<div class="panel"><div class="ptitle">Create Entry</div><div class="fgrid">'+
    fg('Type','sc_type','select',{options:['Study','Practice','Test','Revision','Retest'],value:'Study',required:true})+
    fg('Date','sc_date','date',{required:true})+
    fg('Start Time','sc_start','time',{})+
    fg('End Time','sc_end','time',{})+
    fg('Student','sc_student','select',{options:rowsToOptions(students,'StudentID','Name','— Optional (use Programme) —')})+
    fg('Programme','sc_programme','select',{options:rowsToOptions(programmes,'ProgrammeID','Name')})+
    fg('Subject','sc_subject','select',{options:rowsToOptions(subjects,'SubjectID','Name')})+
    fg('Ref ID (TestID when Type=Test)','sc_ref','text',{})+
    fg('Status','sc_status','select',{options:['ACTIVE','CANCELLED'],value:'ACTIVE'})+
  '</div><div class="arow mt16"><button class="btn gold" id="sc_create">Create Entry</button></div></div>';
  html+='<div class="panel"><div class="ptitle">All Entries ('+schedule.length+')</div>';
  if(!schedule.length)html+=emptyState('No schedule entries.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>ID</th><th>Date</th><th>Start</th><th>End</th><th>Type</th><th>Student</th><th>Programme</th><th>Ref</th><th>Status</th></tr></thead><tbody>';
    schedule.forEach(function(s){
      html+='<tr><td class="mono">'+esc(s.ScheduleID)+'</td><td>'+esc(s.Date)+'</td><td>'+esc(s.StartTime)+'</td><td>'+esc(s.EndTime)+'</td><td>'+esc(s.Type)+'</td><td>'+esc(s.StudentID||'—')+'</td><td>'+esc(s.ProgrammeID||'—')+'</td><td class="mono">'+esc(s.RefID||'')+'</td><td>'+badge(s.Status||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  content.innerHTML=html;
  document.getElementById('sc_create').onclick=async function(){
    var p={Type:val('sc_type'),Date:val('sc_date'),StartTime:val('sc_start'),EndTime:val('sc_end'),StudentID:val('sc_student'),ProgrammeID:val('sc_programme'),SubjectID:val('sc_subject'),RefID:val('sc_ref'),Status:val('sc_status')};
    if(!p.Date)return toast('Date required.','error');
    if(!p.StudentID&&!p.ProgrammeID)return toast('Provide Student or Programme.','error');
    var r=await apiCall('adminCreateSchedule',p);
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Created.','ok');render('schedule');
  };
};

/* ---------- TESTS (external Google Forms) ---------- */
VIEWS.tests=async function(){
  var rs=await Promise.all([apiCall('adminListTests'),apiCall('adminListSubjects'),apiCall('adminListChapters'),apiCall('adminListProgrammes')]);
  var rt=rs[0];
  if(!rt.ok)return errorState(rt.error||'Failed to load.');
  var tests=(rt.data&&rt.data.tests)||[];
  var subjects=(rs[1].ok&&rs[1].data&&rs[1].data.subjects)||[];
  var chapters=(rs[2].ok&&rs[2].data&&rs[2].data.chapters)||[];
  var programmes=(rs[3].ok&&rs[3].data&&rs[3].data.programmes)||[];

  var html=header('Tests','External Google Forms. Create metadata (DRAFT), link the form, advance lifecycle.');
  html+='<div class="panel"><div class="ptitle">Create Test (metadata only — starts as DRAFT)</div><div class="fgrid">'+
    fg('Title','t_title','text',{required:true})+
    fg('Total Marks','t_marks','number',{required:true})+
    fg('Duration (min)','t_dur','number',{required:true})+
    fg('Subject','t_subject','select',{options:rowsToOptions(subjects,'SubjectID','Name')})+
    fg('Chapter','t_chapter','select',{options:rowsToOptions(chapters,'ChapterID','Name')})+
    fg('Programme','t_programme','select',{options:rowsToOptions(programmes,'ProgrammeID','Name')})+
  '</div><div class="arow mt16"><button class="btn gold" id="t_create">Create Test</button></div></div>';

  html+='<div class="panel"><div class="ptitle">All Tests ('+tests.length+')</div>';
  if(!tests.length)html+=emptyState('No tests yet.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>ID</th><th>Title</th><th>Marks</th><th>Dur</th><th>Status</th><th>Form</th><th>Attempts</th><th>Submitted</th><th>Published</th><th></th></tr></thead><tbody>';
    tests.forEach(function(t){
      html+='<tr>'+
        '<td class="mono">'+esc(t.TestID)+'</td>'+
        '<td class="wrap">'+esc(t.Title)+'</td>'+
        '<td>'+esc(t.TotalMarks)+'</td>'+
        '<td>'+esc(t.Duration)+'</td>'+
        '<td>'+badge(t.Status||'')+'</td>'+
        '<td>'+(t.FormID?badge('Linked','published'):badge('Not linked','draft'))+'</td>'+
        '<td>'+esc(t.attempts||0)+'</td>'+
        '<td>'+esc(t.submitted||0)+'</td>'+
        '<td>'+esc(t.published||0)+'</td>'+
        '<td><button class="btn ghost" data-open="'+esc(t.TestID)+'">Open</button></td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  content.innerHTML=html;

  document.getElementById('t_create').onclick=async function(){
    var p={Title:val('t_title'),TotalMarks:val('t_marks'),Duration:val('t_dur'),SubjectID:val('t_subject'),ChapterID:val('t_chapter'),ProgrammeID:val('t_programme')};
    if(!p.Title||p.TotalMarks===''||p.Duration==='')return toast('Title, marks, duration required.','error');
    var r=await apiCall('adminCreateTest',p);
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Created (DRAFT).','ok');
    openTestEditor(r.data.TestID);
  };
  content.querySelectorAll('button[data-open]').forEach(function(b){
    b.onclick=function(){openTestEditor(b.getAttribute('data-open'));};
  });
};

async function openTestEditor(testId){
  var r=await apiCall('adminGetTest',{id:testId});
  if(!r.ok)return toast(r.error||'Failed.','error');
  var test=r.data.test;
  var attempts=r.data.attempts||[];
  var results=r.data.results||[];
  var status=String(test.Status||'').toUpperCase();

  var html=header('Test — '+test.Title,'ID '+test.TestID+' · Status '+status);
  html+='<div class="arow"><button class="btn ghost" id="te_back">← Back to Tests</button></div>';

  html+='<div class="panel"><div class="ptitle">External Google Form</div><div class="fgrid">'+
    fg('Form URL (responder, https)','te_formUrl','text',{full:true,value:test.FormURL||'',placeholder:'https://docs.google.com/forms/d/e/…/viewform'})+
    fg('Form ID or Edit URL','te_formId','text',{full:true,value:test.FormID||'',placeholder:'raw Form ID or https://docs.google.com/forms/d/<ID>/edit',hint:'Backend stores only the raw Form ID. forms.gle is not accepted.'})+
  '</div><div class="arow mt16"><button class="btn gold" id="te_link">Link Form</button></div></div>';

  var allowedNext=[];
  if(status==='DRAFT')allowedNext=['AVAILABLE'];
  else if(status==='AVAILABLE')allowedNext=['CLOSED'];
  var tbtns=allowedNext.map(function(n){return '<button class="btn" data-status="'+n+'">Move → '+n+'</button>';}).join('')||'<span class="quiet">No further manual transitions available.</span>';

  html+='<div class="panel"><div class="ptitle">Lifecycle</div><div class="arow">'+tbtns+'</div>'+
    '<div class="quiet">Strict: DRAFT → AVAILABLE → CLOSED → PUBLISHED. PUBLISHED is set by the publication workflow.</div></div>';

  html+='<div class="panel"><div class="ptitle">Sync &amp; Publish</div><div class="arow">'+
    '<button class="btn" id="te_sync">Sync Form Responses</button>'+
    '<button class="btn gold" id="te_publish">Publish Submitted Results</button>'+
  '</div><div class="quiet">Missing scores are rejected — never silently zeroed.</div></div>';

  html+='<div class="panel"><div class="ptitle">Attempts ('+attempts.length+')</div>';
  if(!attempts.length)html+=emptyState('No attempts yet.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Attempt</th><th>Student</th><th>Token</th><th>Status</th><th>Started</th><th>Submitted</th></tr></thead><tbody>';
    attempts.forEach(function(a){
      html+='<tr><td class="mono">'+esc(a.AttemptID)+'</td><td>'+esc(a.StudentID)+'</td><td class="mono">'+esc(a.Token)+'</td><td>'+badge(a.Status||'')+'</td><td>'+esc(a.StartedAt||'')+'</td><td>'+esc(a.SubmittedAt||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';

  html+='<div class="panel"><div class="ptitle">Results ('+results.length+')</div>';
  if(!results.length)html+=emptyState('No results yet.');
  else{
    html+='<div class="twrap"><table class="tbl"><thead><tr><th>Result</th><th>Student</th><th>Obtained</th><th>Max</th><th>%</th><th>Publication</th></tr></thead><tbody>';
    results.forEach(function(x){
      html+='<tr><td class="mono">'+esc(x.ResultID)+'</td><td>'+esc(x.StudentID)+'</td><td>'+esc(x.MarksObtained)+'</td><td>'+esc(x.MaxMarks)+'</td><td>'+esc(x.Percentage)+'</td><td>'+badge(x.PublicationStatus||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  content.innerHTML=html;

  document.getElementById('te_back').onclick=function(){render('tests');};
  document.getElementById('te_link').onclick=async function(){
    var url=val('te_formUrl'),fid=val('te_formId');
    if(!url||!fid)return toast('Form URL and Form ID/Edit URL required.','error');
    var r2=await apiCall('adminSetTestForm',{testId:testId,formUrl:url,formId:fid});
    if(!r2.ok)return toast(r2.error||'Link failed.','error');
    toast('Form linked.','ok');openTestEditor(testId);
  };
  content.querySelectorAll('button[data-status]').forEach(function(b){
    b.onclick=async function(){
      var st=b.getAttribute('data-status');
      if(!confirm('Move test to '+st+'?'))return;
      var r2=await apiCall('adminSetTestStatus',{testId:testId,status:st});
      if(!r2.ok)return toast(r2.error||'Failed.','error');
      toast('Status → '+st,'ok');openTestEditor(testId);
    };
  });
  document.getElementById('te_sync').onclick=async function(){
    if(!confirm('Sync Google Form responses?'))return;
    var r2=await apiCall('adminSyncSubmissions',{testId:testId});
    if(!r2.ok)return toast(r2.error||'Sync failed.','error');
    toast('Synced. Processed: '+(r2.data.processed||0)+', Rejected: '+(r2.data.rejected||0),'ok');
    openTestEditor(testId);
  };
  document.getElementById('te_publish').onclick=async function(){
    if(!confirm('Publish all SUBMITTED attempts?'))return;
    var r2=await apiCall('adminPublishResult',{testId:testId});
    if(!r2.ok)return toast(r2.error||'Publish failed.','error');
    toast('Published: '+(r2.data.published||0),'ok');
    openTestEditor(testId);
  };
}

/* ---------- RESULTS ---------- */
VIEWS.results=async function(){

    html+='<tr><td class="mono">'+esc(x.ResultID)+'</td><td>'+esc(x.StudentID)+'</td><td>'+esc(x.TestID)+'</td><td>'+esc(x.MarksObtained)+'</td><td>'+esc(x.MaxMarks)+'</td><td>'+esc(x.Percentage)+'</td><td>'+badge(x.PublicationStatus||'')+'</td></tr>';

/* ---------- PASSWORD ---------- */
VIEWS.password=async function(){
  var html=header('Change Password','You will be signed out after changing your password.');
  html+='<div class="panel"><div class="fgrid">'+
    fg('New Password','ap_new','password',{required:true,minlength:6,hint:'Minimum 6 characters.'})+
    fg('Confirm New Password','ap_conf','password',{required:true,minlength:6})+
  '</div><div class="arow mt16"><button class="btn gold" id="ap_go">Change Password</button></div></div>';
  content.innerHTML=html;
  document.getElementById('ap_go').onclick=async function(){
    var a=val('ap_new'),b=val('ap_conf');
    if(a.length<6)return toast('Password must be at least 6 characters.','error');
    if(a!==b)return toast('Passwords do not match.','error');
    var r=await apiCall('adminPasswordChange',{newPassword:a});
    if(!r.ok)return toast(r.error||'Failed.','error');
    toast('Password changed. Please log in again.','ok');
    clearSession();
    setTimeout(function(){window.location.href='login.html';},1000);
  };
};

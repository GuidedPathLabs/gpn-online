<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Sign in — Guided Path One-on-One</title>
<style>
:root{--bg:#060f1e;--bg2:#0a192f;--bg3:#102844;--line:rgba(0,184,212,.22);--l2:rgba(0,184,212,.12);--cy:#00e5ff;--cyd:#00b8d4;--gold:#ffd54f;--tx:#e0e0e0;--mu:#8a9bb0;--dng:#ff6b6b;--ok:#4caf50}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-text-size-adjust:100%}
.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 20% 20%,rgba(0,184,212,.08),transparent 55%),radial-gradient(circle at 80% 80%,rgba(255,213,79,.05),transparent 55%),var(--bg)}
.card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:28px 24px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.brand{text-align:center;margin-bottom:22px}
.title{font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:.02em;line-height:1.2}
.title span{color:var(--cy)}
.sub{color:var(--mu);font-size:.8rem;margin-top:6px;letter-spacing:.12em;text-transform:uppercase}
.rtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.rtab{padding:10px;text-align:center;border:1px solid var(--l2);border-radius:6px;background:transparent;color:var(--mu);font-family:inherit;font-size:.82rem;font-weight:700;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.rtab.active{border-color:var(--cy);color:var(--gold);background:rgba(0,184,212,.08)}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fg label{font-size:.7rem;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input{width:100%;padding:11px 12px;background:rgba(0,0,0,.35);border:1px solid var(--l2);border-radius:6px;color:var(--tx);font-family:inherit;font-size:.95rem;min-height:44px;transition:border-color .15s,box-shadow .15s}
.fg input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.12)}
.err{display:none;padding:10px 12px;border-radius:6px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4);color:#ffbaba;font-size:.85rem;margin-bottom:12px}
.err.show{display:block}
.okbox{display:none;padding:10px 12px;border-radius:6px;background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.4);color:#b6e8b6;font-size:.85rem;margin-bottom:12px}
.okbox.show{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;font-family:inherit;font-size:.88rem;font-weight:700;letter-spacing:.04em;border-radius:6px;cursor:pointer;border:1px solid rgba(255,213,79,.45);background:rgba(255,213,79,.06);color:var(--gold);transition:background .18s,border-color .18s;min-height:44px;width:100%}
.btn:hover:not(:disabled){background:rgba(255,213,79,.14);border-color:var(--gold)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,213,79,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.quiet{color:var(--mu);font-size:.78rem;text-align:center;margin-top:18px}
.tw{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px);pointer-events:none}
.tt{background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:6px;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:auto}
.tt.ok{border-color:rgba(76,175,80,.5);color:#b6e8b6}
.tt.error{border-color:rgba(255,107,107,.5);color:#ffbaba}
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="brand">
      <div class="title">Guided Path <span>One-on-One</span></div>
      <div class="sub">Secure sign-in</div>
    </div>

    <div id="alreadyBox" class="okbox"></div>

    <div class="rtabs" role="tablist" aria-label="Select role">
      <button type="button" class="rtab active" data-role="STUDENT" role="tab" aria-selected="true">Student</button>
      <button type="button" class="rtab" data-role="ADMIN" role="tab" aria-selected="false">Administrator</button>
    </div>

    <form id="loginForm" novalidate>
      <div class="fg">
        <label for="loginId" id="loginIdLabel">Student ID</label>
        <input id="loginId" type="text" autocapitalize="characters" autocomplete="username" required />
      </div>
      <div class="fg">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" />
      </div>

      <div id="loginError" class="err" role="alert"></div>

      <button id="loginBtn" type="submit" class="btn">Sign in</button>
    </form>

    <div class="quiet">Contact your teacher if you cannot sign in.</div>
  </div>
</div>

<div class="tw" id="toastWrap"></div>

<script>
const GPN_API_URL = 'https://script.google.com/macros/s/AKfycbx0dOo1ovROMdFYedx4Gm3a1tmpZjjXEwqcxLjCzWXC3Tgxupo9Mc3obk5zDS3uat_7/exec';
const K_TOKEN = 'gpn_token';
const K_ROLE  = 'gpn_role';
const K_USER  = 'gpn_user';
const K_NAME  = 'gpn_name';

function toast(msg, kind) {
  var w = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'tt ' + (kind || '');
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(function () { el.remove(); }, 4000);
}

async function apiCall(action, payload, token) {
  var res;
  try {
    res = await fetch(GPN_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, token: token || '', payload: payload || {} }),
      redirect: 'follow'
    });
  } catch (e) {
    return { ok: false, error: 'Network error. Check your connection.', code: 'NETWORK' };
  }
  try { return await res.json(); }
  catch (e) { return { ok: false, error: 'Malformed server response.', code: 'BAD_JSON' }; }
}

function clearAll() {
  [K_TOKEN, K_ROLE, K_USER, K_NAME].forEach(function (k) {
    localStorage.removeItem(k);
    sessionStorage.removeItem(k);
  });
}

var currentRole = 'STUDENT';
var tabs = document.querySelectorAll('.rtab');
var loginIdLabel = document.getElementById('loginIdLabel');
var form = document.getElementById('loginForm');
var btn = document.getElementById('loginBtn');
var errBox = document.getElementById('loginError');
var already = document.getElementById('alreadyBox');

tabs.forEach(function (t) {
  t.addEventListener('click', function () {
    currentRole = t.getAttribute('data-role');
    tabs.forEach(function (x) {
      var on = (x === t);
      x.classList.toggle('active', on);
      x.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    loginIdLabel.textContent = currentRole === 'ADMIN' ? 'Admin ID' : 'Student ID';
    errBox.classList.remove('show');
  });
});

function showError(m) { errBox.textContent = m; errBox.classList.add('show'); }

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  errBox.classList.remove('show');
  var lid = document.getElementById('loginId').value.trim();
  var pw = document.getElementById('password').value;
  if (!lid) return showError('Please enter your ID.');
  if (!pw) return showError('Please enter your password.');
  if (pw.length < 6) return showError('Password must be at least 6 characters.');

  btn.disabled = true;
  var old = btn.textContent;
  btn.innerHTML = '<span class="spin"></span>Signing in…';

  var res = await apiCall('login', { loginId: lid, password: pw, role: currentRole });

  btn.disabled = false;
  btn.textContent = old;

  if (!res || !res.ok) {
    var msg = (res && res.error) || 'Sign-in failed.';
    if (res && res.code === 'INVALID_CREDENTIALS') msg = 'Invalid ID or password.';
    if (res && res.code === 'ACCOUNT_INACTIVE') msg = 'Your account is inactive. Contact your teacher.';
    return showError(msg);
  }

  var d = res.data || {};
  localStorage.setItem(K_TOKEN, d.token || '');
  localStorage.setItem(K_ROLE,  String(d.role || currentRole).toUpperCase());
  localStorage.setItem(K_USER,  d.userId || lid);
  localStorage.setItem(K_NAME,  d.name || '');

  toast('Welcome, ' + (d.name || d.userId) + '.', 'ok');

  setTimeout(function () {
    window.location.href = (String(d.role).toUpperCase() === 'ADMIN') ? 'admin.html' : 'student.html';
  }, 400);
});

window.addEventListener('load', function () {
  var t = localStorage.getItem(K_TOKEN);
  var r = localStorage.getItem(K_ROLE);
  if (t && r) {
    already.textContent = 'You are already signed in as ' + (localStorage.getItem(K_NAME) || localStorage.getItem(K_USER) || '') + '. Redirecting…';
    already.classList.add('show');
    setTimeout(function () {
      window.location.href = (r === 'ADMIN') ? 'admin.html' : 'student.html';
    }, 900);
    return;
  }
  document.getElementById('loginId').focus();
});
</script>
</body>
</html>n></span>
      </button>

    </form>

    <p class="gpn-help">
      Forgot your password? Contact your teacher.<br>
      Accounts are created by the <strong>administrator</strong>.
    </p>

  </main>

  <footer class="gpn-footer">
    <span>Guided Path Noida</span>
    <span class="dot">·</span>
    <span>v2.4.1</span>
  </footer>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   GUIDED PATH — LOGIN SCRIPT
   1  CONFIG
   2  DOM HELPERS
   3  ROLE SWITCH
   4  FORM SUBMIT
   5  BOOT
   ═══════════════════════════════════════════════════════════════ */

/* 1  CONFIG */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx0dOo1ovROMdFYedx4Gm3a1tmpZjjXEwqcxLjCzWXC3Tgxupo9Mc3obk5zDS3uat_7/exec',
  TOKEN_KEY: 'gp_token',
  ROLE_KEY:  'gp_role',
  USER_KEY:  'gp_user'
};

/* 2  DOM HELPERS */
function el(id){ return document.getElementById(id); }

function showAlert(message, kind){
  var box = el('loginAlert');
  box.className = 'gpn-alert ' + (kind || 'error');
  box.textContent = message;
}
function clearAlert(){
  var box = el('loginAlert');
  box.className = 'gpn-alert';
  box.textContent = '';
}
function setLoading(on){
  var btn = el('loginBtn');
  var lbl = btn.querySelector('.btn-label');
  var spn = btn.querySelector('.btn-spinner');
  if (on){
    btn.disabled = true;
    lbl.textContent = 'Signing in…';
    spn.hidden = false;
  } else {
    btn.disabled = false;
    lbl.textContent = 'Sign In';
    spn.hidden = true;
  }
}

/* 3  ROLE SWITCH */
var currentRole = 'STUDENT';
var roleBtns = document.querySelectorAll('.gpn-role-btn');

function setRole(role){
  currentRole = role;
  for (var i = 0; i < roleBtns.length; i++){
    var b = roleBtns[i];
    var active = b.getAttribute('data-role') === role;
    b.classList.toggle('is-active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  }
  var label = el('loginIdLabel');
  var input = el('loginId');
  if (role === 'ADMIN'){
    label.textContent = 'Admin ID';
    input.placeholder = 'ADM-0001';
  } else {
    label.textContent = 'Student ID';
    input.placeholder = 'STU-0001';
  }
  clearAlert();
}

for (var i = 0; i < roleBtns.length; i++){
  (function(btn){
    btn.addEventListener('click', function(){
      setRole(btn.getAttribute('data-role'));
      el('loginId').focus();
    });
  })(roleBtns[i]);
}

/* 4  FORM SUBMIT */
el('pwToggle').addEventListener('click', function(){
  var pw  = el('password');
  var btn = el('pwToggle');
  if (pw.type === 'password'){ pw.type = 'text';     btn.textContent = 'Hide'; }
  else                       { pw.type = 'password'; btn.textContent = 'Show'; }
});

el('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  clearAlert();

  var loginId  = el('loginId').value.trim().toUpperCase();
  var password = el('password').value;

  if (!loginId || !password){
    showAlert('Please enter both ID and password.', 'error');
    return;
  }
  if (CONFIG.API_URL.indexOf('PASTE_') === 0){
    showAlert('Backend URL is not configured in this build.', 'error');
    return;
  }

  setLoading(true);

  var payload = {
    action:  'login',
    token:   '',
    payload: {
      loginId:  loginId,
      password: password,
      role:     currentRole
    }
  };

  fetch(CONFIG.API_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body:    JSON.stringify(payload),
    redirect:'follow'
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    setLoading(false);

    if (!data || !data.ok){
      var msg  = (data && data.error) || 'Login failed.';
      var code = (data && data.code) || '';
      if (code === 'INVALID_CREDENTIALS') msg = 'Invalid ID or password.';
      else if (code === 'ACCOUNT_INACTIVE') msg = msg + ' Please contact your teacher.';
      else if (code === 'INVALID_ROLE')     msg = 'Please choose Student or Admin.';
      else if (code === 'SERVER_BUSY')      msg = 'Server is busy. Please try again in a moment.';
      showAlert(msg, 'error');
      return;
    }

    try {
      localStorage.setItem(CONFIG.TOKEN_KEY, data.data.token);
      localStorage.setItem(CONFIG.ROLE_KEY,  data.data.role);
      localStorage.setItem(CONFIG.USER_KEY,  JSON.stringify({
        id:   data.data.userId,
        name: data.data.name || ''
      }));
    } catch (err){
      showAlert('Could not save your session in this browser.', 'error');
      return;
    }

    showAlert('Signed in. Redirecting…', 'info');

    if (data.data.role === 'ADMIN'){
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'student.html';
    }
  })
  .catch(function(err){
    setLoading(false);
    showAlert('Network error. Please check your connection and try again.', 'error');
  });
});

/* Enter from ID field moves to password */
el('loginId').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); el('password').focus(); }
});

/* 5  BOOT */
(function boot(){
  /* If an unexpired session already exists, skip the login screen. */
  var token = localStorage.getItem(CONFIG.TOKEN_KEY);
  var role  = localStorage.getItem(CONFIG.ROLE_KEY);
  if (token && (role === 'ADMIN' || role === 'STUDENT')){
    window.location.href = role === 'ADMIN' ? 'admin.html' : 'student.html';
    return;
  }
  el('loginId').focus();
})();
</script>
</body>
</html>

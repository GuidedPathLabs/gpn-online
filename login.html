<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a192f">
<title>Guided Path · Sign In</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   GUIDED PATH — LOGIN
   Visual source of truth: Global Style file
   Sections:
     1  TOKENS
     2  RESET
     3  SHELL
     4  BRAND
     5  CARD
     6  ROLE SWITCH
     7  FORM
     8  BUTTON
     9  ALERTS
    10  FOOTER
    11  RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */

/* 1  TOKENS */
:root{
  --gpn-navy:        #0a192f;
  --gpn-navy-2:      #0d1f3a;
  --gpn-navy-3:      #102844;
  --gpn-cyan:        #00b8d4;
  --gpn-cyan-hi:     #00e5ff;
  --gpn-gold:        #ffd54f;
  --gpn-gold-dim:    #b58900;
  --gpn-text:        #e0e0e0;
  --gpn-muted:       #c0c0c0;
  --gpn-dim:         #b0c4de;
  --gpn-border:      rgba(0,184,212,0.25);
  --gpn-border-hi:   rgba(0,184,212,0.55);
  --gpn-divider:     rgba(0,184,212,0.18);
  --gpn-danger:      #ef5350;
  --gpn-danger-soft: #ff9e9e;
  --gpn-radius:      10px;
  --gpn-radius-sm:   6px;
  --gpn-serif:       Georgia, 'Times New Roman', serif;
  --gpn-sans:        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

/* 2  RESET */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--gpn-sans);
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(0,184,212,0.07), transparent 55%),
    radial-gradient(700px 400px at 100% 0%, rgba(255,213,79,0.05), transparent 50%),
    var(--gpn-navy);
  color:var(--gpn-text);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

/* 3  SHELL */
.gpn-shell{
  width:100%;
  max-width:420px;
  position:relative;
  z-index:1;
}

/* 4  BRAND */
.gpn-brand-block{
  text-align:center;
  margin-bottom:24px;
}
.gpn-mark{
  width:60px;height:60px;
  margin:0 auto 12px;
  border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gpn-cyan),#007b8f);
  color:#04121e;
  font-family:var(--gpn-serif);
  font-weight:800;
  font-size:22px;
  letter-spacing:1px;
  border:1px solid rgba(0,229,255,0.4);
  box-shadow:0 0 20px rgba(0,184,212,0.35);
}
.gpn-brand-name{
  margin:0;
  font-family:var(--gpn-serif);
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:.28em;
  color:#fff;
}
.gpn-brand-sub{
  margin:6px 0 10px;
  font-family:var(--gpn-serif);
  font-size:.72rem;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:var(--gpn-cyan-hi);
  font-weight:700;
}
.gpn-brand-tag{
  margin:0;
  font-size:.78rem;
  color:var(--gpn-dim);
  letter-spacing:.06em;
}

/* 5  CARD */
.gpn-card{
  background:var(--gpn-navy);
  border:1px solid var(--gpn-border);
  border-radius:var(--gpn-radius);
  padding:22px 20px;
  box-shadow:0 0 24px rgba(0,184,212,0.10), 0 8px 32px rgba(0,0,0,0.35);
  transition:border-color .25s, box-shadow .25s;
}
.gpn-card:hover{
  border-color:var(--gpn-border-hi);
  box-shadow:0 0 28px rgba(0,184,212,0.16), 0 8px 32px rgba(0,0,0,0.4);
}

/* 6  ROLE SWITCH */
.gpn-role-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:rgba(0,0,0,0.25);
  border:1px solid var(--gpn-divider);
  border-radius:var(--gpn-radius-sm);
  padding:5px;
  margin-bottom:18px;
}
.gpn-role-btn{
  padding:10px 8px;
  background:transparent;
  border:0;
  border-radius:5px;
  color:var(--gpn-dim);
  font-family:var(--gpn-serif);
  font-size:.85rem;
  font-weight:700;
  letter-spacing:.06em;
  cursor:pointer;
  transition:background .2s, color .2s, box-shadow .2s;
}
.gpn-role-btn:hover{color:#fff;}
.gpn-role-btn.is-active{
  background:linear-gradient(135deg,var(--gpn-cyan),#007b8f);
  color:#04121e;
  box-shadow:0 0 12px rgba(0,184,212,0.4);
}

/* 7  FORM */
.gpn-field{margin-bottom:14px;}
.gpn-field label{
  display:block;
  font-size:.66rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--gpn-cyan);
  font-weight:700;
  margin-bottom:6px;
}
.gpn-field input{
  width:100%;
  padding:12px 14px;
  background:var(--gpn-navy-2);
  border:1px solid var(--gpn-border);
  border-radius:var(--gpn-radius-sm);
  color:var(--gpn-text);
  font-family:var(--gpn-sans);
  font-size:.95rem;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  letter-spacing:.02em;
}
.gpn-field input:focus{
  border-color:var(--gpn-cyan-hi);
  box-shadow:0 0 0 3px rgba(0,229,255,0.12);
}
.gpn-field input::placeholder{color:#6a80a0;}
.gpn-pw-wrap{position:relative;}
.gpn-pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;
  color:var(--gpn-cyan-hi);
  font-family:var(--gpn-serif);
  font-size:.72rem;font-weight:700;
  letter-spacing:.06em;
  cursor:pointer;
  padding:8px 10px;
  border-radius:4px;
  transition:background .2s,color .2s;
}
.gpn-pw-toggle:hover{background:rgba(0,229,255,0.08);color:#fff;}

/* 8  BUTTON */
.gpn-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;
  border-radius:var(--gpn-radius-sm);
  border:1px solid transparent;
  background:linear-gradient(135deg,var(--gpn-gold),var(--gpn-gold-dim));
  color:#1a1405;
  font-family:var(--gpn-serif);
  font-size:.92rem;
  font-weight:700;
  letter-spacing:.04em;
  cursor:pointer;
  transition:background .2s, box-shadow .2s, transform .12s;
  box-shadow:0 0 16px rgba(255,213,79,0.22);
  text-decoration:none;
  line-height:1.2;
  width:100%;
}
.gpn-btn:hover{
  background:linear-gradient(135deg,#ffe082,var(--gpn-gold));
  box-shadow:0 0 22px rgba(255,213,79,0.38);
}
.gpn-btn:active{transform:translateY(1px);}
.gpn-btn[disabled]{opacity:.6;cursor:not-allowed;box-shadow:none;}

.gpn-spinner{
  width:15px;height:15px;
  border-radius:50%;
  border:2px solid rgba(26,20,5,0.25);
  border-top-color:#1a1405;
  animation:gpnSpin .7s linear infinite;
}
@keyframes gpnSpin{to{transform:rotate(360deg);}}

/* 9  ALERTS */
.gpn-alert{
  padding:11px 14px;
  border-radius:var(--gpn-radius-sm);
  font-size:.83rem;
  line-height:1.45;
  margin-bottom:12px;
  display:none;
}
.gpn-alert.error{
  display:block;
  background:rgba(239,83,80,0.09);
  border:1px solid rgba(239,83,80,0.4);
  border-left:3px solid var(--gpn-danger);
  color:var(--gpn-danger-soft);
}
.gpn-alert.info{
  display:block;
  background:rgba(0,184,212,0.07);
  border:1px solid rgba(0,229,255,0.35);
  border-left:3px solid var(--gpn-cyan-hi);
  color:#a7e8f6;
}

/* 10 HELP + FOOTER */
.gpn-help{
  margin:16px 0 0;
  text-align:center;
  font-size:.78rem;
  color:var(--gpn-dim);
  line-height:1.7;
}
.gpn-help strong{color:var(--gpn-cyan-hi);font-weight:700;}
.gpn-footer{
  margin-top:20px;
  text-align:center;
  font-size:.7rem;
  color:var(--gpn-dim);
  letter-spacing:.06em;
}
.gpn-footer .dot{margin:0 8px;color:var(--gpn-cyan);}

/* 11 RESPONSIVE */
@media (max-width:480px){
  body{padding:16px 12px;}
  .gpn-brand-name{font-size:1.15rem;letter-spacing:.22em;}
  .gpn-brand-sub{font-size:.66rem;letter-spacing:.34em;}
  .gpn-card{padding:18px 16px;}
  .gpn-mark{width:54px;height:54px;font-size:19px;}
}
</style>
</head>
<body>

<div class="gpn-shell">

  <header class="gpn-brand-block">
    <div class="gpn-mark">GP</div>
    <h1 class="gpn-brand-name">GUIDED PATH</h1>
    <p class="gpn-brand-sub">One-on-One</p>
    <p class="gpn-brand-tag">Study · Practice · Test · Improve</p>
  </header>

  <main class="gpn-card">

    <div class="gpn-role-switch" role="tablist" aria-label="Login type">
      <button type="button" class="gpn-role-btn is-active" data-role="STUDENT" role="tab" aria-selected="true">Student</button>
      <button type="button" class="gpn-role-btn" data-role="ADMIN" role="tab" aria-selected="false">Admin</button>
    </div>

    <div id="loginAlert" class="gpn-alert" role="alert"></div>

    <form id="loginForm" autocomplete="on" novalidate>

      <div class="gpn-field">
        <label for="loginId" id="loginIdLabel">Student ID</label>
        <input type="text" id="loginId" name="loginId" placeholder="STU-0001"
               autocapitalize="characters" autocomplete="username"
               spellcheck="false" inputmode="text" required>
      </div>

      <div class="gpn-field">
        <label for="password">Password</label>
        <div class="gpn-pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" id="pwToggle" class="gpn-pw-toggle" aria-label="Show password">Show</button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="gpn-btn">
        <span class="btn-label">Sign In</span>
        <span class="btn-spinner" hidden><span class="gpn-spinner"></span></span>
      </button>

    </form>

    <p class="gpn-help">
      Forgot your password? Contact your teacher.<br>
      Accounts are created by the <strong>administrator</strong>.
    </p>

  </main>

  <footer class="gpn-footer">
    <span>Guided Path Noida</span>
    <span class="dot">·</span>
    <span>v2.4.1</span>
  </footer>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   GUIDED PATH — LOGIN SCRIPT
   1  CONFIG
   2  DOM HELPERS
   3  ROLE SWITCH
   4  FORM SUBMIT
   5  BOOT
   ═══════════════════════════════════════════════════════════════ */

/* 1  CONFIG */
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx0dOo1ovROMdFYedx4Gm3a1tmpZjjXEwqcxLjCzWXC3Tgxupo9Mc3obk5zDS3uat_7/exec',
  TOKEN_KEY: 'gp_token',
  ROLE_KEY:  'gp_role',
  USER_KEY:  'gp_user'
};

/* 2  DOM HELPERS */
function el(id){ return document.getElementById(id); }

function showAlert(message, kind){
  var box = el('loginAlert');
  box.className = 'gpn-alert ' + (kind || 'error');
  box.textContent = message;
}
function clearAlert(){
  var box = el('loginAlert');
  box.className = 'gpn-alert';
  box.textContent = '';
}
function setLoading(on){
  var btn = el('loginBtn');
  var lbl = btn.querySelector('.btn-label');
  var spn = btn.querySelector('.btn-spinner');
  if (on){
    btn.disabled = true;
    lbl.textContent = 'Signing in…';
    spn.hidden = false;
  } else {
    btn.disabled = false;
    lbl.textContent = 'Sign In';
    spn.hidden = true;
  }
}

/* 3  ROLE SWITCH */
var currentRole = 'STUDENT';
var roleBtns = document.querySelectorAll('.gpn-role-btn');

function setRole(role){
  currentRole = role;
  for (var i = 0; i < roleBtns.length; i++){
    var b = roleBtns[i];
    var active = b.getAttribute('data-role') === role;
    b.classList.toggle('is-active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');
  }
  var label = el('loginIdLabel');
  var input = el('loginId');
  if (role === 'ADMIN'){
    label.textContent = 'Admin ID';
    input.placeholder = 'ADM-0001';
  } else {
    label.textContent = 'Student ID';
    input.placeholder = 'STU-0001';
  }
  clearAlert();
}

for (var i = 0; i < roleBtns.length; i++){
  (function(btn){
    btn.addEventListener('click', function(){
      setRole(btn.getAttribute('data-role'));
      el('loginId').focus();
    });
  })(roleBtns[i]);
}

/* 4  FORM SUBMIT */
el('pwToggle').addEventListener('click', function(){
  var pw  = el('password');
  var btn = el('pwToggle');
  if (pw.type === 'password'){ pw.type = 'text';     btn.textContent = 'Hide'; }
  else                       { pw.type = 'password'; btn.textContent = 'Show'; }
});

el('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  clearAlert();

  var loginId  = el('loginId').value.trim().toUpperCase();
  var password = el('password').value;

  if (!loginId || !password){
    showAlert('Please enter both ID and password.', 'error');
    return;
  }
  if (CONFIG.API_URL.indexOf('PASTE_') === 0){
    showAlert('Backend URL is not configured in this build.', 'error');
    return;
  }

  setLoading(true);

  var payload = {
    action:  'login',
    token:   '',
    payload: {
      loginId:  loginId,
      password: password,
      role:     currentRole
    }
  };

  fetch(CONFIG.API_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body:    JSON.stringify(payload),
    redirect:'follow'
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    setLoading(false);

    if (!data || !data.ok){
      var msg  = (data && data.error) || 'Login failed.';
      var code = (data && data.code) || '';
      if (code === 'INVALID_CREDENTIALS') msg = 'Invalid ID or password.';
      else if (code === 'ACCOUNT_INACTIVE') msg = msg + ' Please contact your teacher.';
      else if (code === 'INVALID_ROLE')     msg = 'Please choose Student or Admin.';
      else if (code === 'SERVER_BUSY')      msg = 'Server is busy. Please try again in a moment.';
      showAlert(msg, 'error');
      return;
    }

    try {
      localStorage.setItem(CONFIG.TOKEN_KEY, data.data.token);
      localStorage.setItem(CONFIG.ROLE_KEY,  data.data.role);
      localStorage.setItem(CONFIG.USER_KEY,  JSON.stringify({
        id:   data.data.userId,
        name: data.data.name || ''
      }));
    } catch (err){
      showAlert('Could not save your session in this browser.', 'error');
      return;
    }

    showAlert('Signed in. Redirecting…', 'info');

    if (data.data.role === 'ADMIN'){
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'student.html';
    }
  })
  .catch(function(err){
    setLoading(false);
    showAlert('Network error. Please check your connection and try again.', 'error');
  });
});

/* Enter from ID field moves to password */
el('loginId').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); el('password').focus(); }
});

/* 5  BOOT */
(function boot(){
  /* If an unexpired session already exists, skip the login screen. */
  var token = localStorage.getItem(CONFIG.TOKEN_KEY);
  var role  = localStorage.getItem(CONFIG.ROLE_KEY);
  if (token && (role === 'ADMIN' || role === 'STUDENT')){
    window.location.href = role === 'ADMIN' ? 'admin.html' : 'student.html';
    return;
  }
  el('loginId').focus();
})();
</script>
</body>
</html>
